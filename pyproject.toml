[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "methodmesh-sentinel-archive"
version = "0.3.0"
description = "Byte-preserving ODK Central submission archive for Sentinel"
requires-python = ">=3.11"
dependencies = [
    "reportlab>=4.0",
]

[tool.setuptools]
packages = ["sentinel_archive"]

[project.scripts]
sentinel-audit = "sentinel_archive.cli:main"
